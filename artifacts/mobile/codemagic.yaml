workflows:
  android-apk:
    name: Android APK
    max_build_duration: 60
    environment:
      node: 20.17.0
    scripts:
      - name: Install pnpm
        script: npm install -g pnpm
      - name: Install dependencies (monorepo)
        script: cd /home/runner/project && pnpm install --no-frozen-lockfile || true; cd $CM_BUILD_DIR && pnpm install --no-frozen-lockfile
      - name: Expo prebuild
        script: npx expo prebuild --platform android --clean
      - name: Build APK
        script: |
          cd android
          ./gradlew assembleRelease
    artifacts:
      - android/app/build/outputs/apk/release/*.apk
